<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pair | ArbCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="pair">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">ArbCheck</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html" aria-current="page">Pairs</a>
        <a href="opportunities.html">Opportunities</a>
        <a href="results.html">Results</a>
        <a href="admin.html">Admin</a>
      </nav>
      <p class="feed" id="feed"><strong>Connecting</strong><br>Checking the poller</p>
    </div>
  </header>
  <main id="pair-main">
    <div class="page-head">
      <p class="small"><a href="index.html">All pairs</a></p>
      <h1 id="pair-title">Loading</h1>
      <div class="meta-row" id="pair-meta"></div>
    </div>

    <div class="grid-2">
      <section class="panel plan" id="plan" aria-labelledby="plan-h">
        <h2 id="plan-h">Best trade plan</h2>
        <p class="muted">Loading.</p>
      </section>
      <section aria-labelledby="books-h">
        <h2 id="books-h">Order books</h2>
        <div id="books"><p class="muted">Loading.</p></div>
      </section>
    </div>

    <h2>Rules</h2>
    <p id="rules-links"></p>
    <div class="panel">
      <p id="rules-notes" style="margin:0"></p>
    </div>
  </main>
</body>
</html>
