<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results | ArbCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="results">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">ArbCheck</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Pairs</a>
        <a href="opportunities.html">Opportunities</a>
        <a href="results.html" aria-current="page">Results</a>
        <a href="admin.html">Admin</a>
      </nav>
      <p class="feed" id="feed"><strong>Connecting</strong><br>Checking the poller</p>
    </div>
  </header>
  <main>
    <div class="page-head">
      <h1>Results</h1>
    </div>
    <p class="lead" id="lead">Loading results.</p>

    <section class="panel" aria-labelledby="funnel-h">
      <h2 id="funnel-h">How many gaps survived fees</h2>
      <div class="funnel">
        <div class="funnel-row">
          <span>Gaps before fees</span>
          <div class="funnel-bar"><span id="bar-all" style="width:0%"></span></div>
          <span class="funnel-count" id="count-all">0</span>
        </div>
        <div class="funnel-row after">
          <span>Survived fees</span>
          <div class="funnel-bar"><span id="bar-survived" style="width:0%"></span></div>
          <span class="funnel-count" id="count-survived">0</span>
        </div>
      </div>
    </section>

    <h2 id="survivors-h">How big the survivors were</h2>
    <div class="panel">
      <dl class="stats">
        <div><dt>Median edge per pair</dt><dd id="stat-edge">None</dd></div>
        <div><dt>Median size</dt><dd id="stat-size">None</dd></div>
        <div><dt>Median profit</dt><dd id="stat-profit">None</dd></div>
        <div><dt>Largest profit</dt><dd id="stat-largest">None</dd></div>
      </dl>
    </div>
    <p class="small muted" id="fee-note"></p>
  </main>
</body>
</html>
