<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opportunities | ArbCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="opportunities">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">ArbCheck</a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Pairs</a>
        <a href="opportunities.html" aria-current="page">Opportunities</a>
        <a href="results.html">Results</a>
        <a href="admin.html">Admin</a>
      </nav>
      <p class="feed" id="feed"><strong>Connecting</strong><br>Checking the poller</p>
    </div>
  </header>
  <main>
    <div class="page-head">
      <h1>Opportunities</h1>
      <p>Every gap the scanner has found, newest first, including the ones fees wiped out.</p>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Pair</th>
            <th scope="col">Direction</th>
            <th scope="col">Opened</th>
            <th scope="col">Closed</th>
            <th scope="col" class="num">Size</th>
            <th scope="col" class="num">Before fees</th>
            <th scope="col" class="num">After fees</th>
            <th scope="col">Result</th>
          </tr>
        </thead>
        <tbody id="opps-body">
          <tr><td colspan="8" class="muted">Loading the log.</td></tr>
        </tbody>
      </table>
    </div>
    <p class="small muted" id="opps-note"></p>
  </main>
